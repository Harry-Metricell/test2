name: Import Ready For Testing Tickets

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 06:15 UTC. Use workflow_dispatch for an immediate refresh.
    - cron: '15 6 * * 1-5'

concurrency:
  group: jira-import
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Search Jira
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_READY_STATUS: ${{ vars.JIRA_READY_STATUS }}
        run: |
          curl -sS --fail --retry 3 \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --get \
            --data-urlencode "jql=project = ${JIRA_PROJECT_KEY:-TEST2} ORDER BY updated DESC" \
            --data-urlencode "maxResults=100" \
            --data-urlencode "fields=summary,status,priority,assignee,parent,created,updated,description,subtasks,project" \
            "$JIRA_URL/rest/api/3/search/jql" \
            > results.json

      - name: Create or refresh ticket folders
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('results.json', 'utf8'));
          const issues = result.issues || [];
          const active = new Set();
          for (const issue of issues) {
            const jiraStatus = String(issue.fields?.status?.name || 'Unknown');
            if (jiraStatus.toLowerCase() === 'done') continue;
            active.add(issue.key);
            const dir = `tickets/${issue.key}`;
            fs.mkdirSync(`${dir}/screenshots`, { recursive: true });
            fs.mkdirSync(`${dir}/reports`, { recursive: true });
            fs.writeFileSync(`${dir}/screenshots/.gitkeep`, '');
            fs.writeFileSync(`${dir}/reports/.gitkeep`, '');
            fs.writeFileSync(`${dir}/ticket.json`, `${JSON.stringify(issue, null, 2)}\\n`);
            if (!fs.existsSync(`${dir}/status.json`)) {
              fs.writeFileSync(`${dir}/status.json`, `${JSON.stringify({ ticket: issue.key, status: 'Imported' }, null, 2)}\\n`);
            }
          }
          console.log(`Imported ${(result.issues || []).length} Jira issues`);
          NODE

      - name: Generate normalized tracker data and handoffs
        run: npm run generate

      - name: Commit imported and generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tickets status
          git commit -m "Import Jira tickets and refresh QA plan" || echo "No changes"
          git push

      - name: Show Codex handoffs
        run: |
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('status/handoffs.json','utf8')); console.log(JSON.stringify(h,null,2));"
          echo "A separate approved Codex bridge can consume status/handoffs.json."
