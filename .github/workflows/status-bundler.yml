name: Status Bundler

on:
  workflow_dispatch:
  push:
    paths:
      - 'tickets/**'
      - 'scripts/generate-status.mjs'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: qa-repo-writes
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate status and handoffs
        run: node scripts/generate-status.mjs

      - name: Validate generated criteria
        run: node scripts/check-criteria.mjs

      - name: Commit status only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate-status.mjs
            node scripts/check-criteria.mjs
            git add status
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Bundle QA status and handoffs"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to publish bundled status after three attempts."
          exit 1
