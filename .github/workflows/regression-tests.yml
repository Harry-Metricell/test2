name: Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/briefs/**'
      - 'docs/publisher-operations.md'
      - 'README.md'
      - 'config/user-guide-*.json'
      - 'config/testing-context/**'
      - 'config/qa-verification-batch.json'
      - 'package.json'
      - 'requirements-reporting.txt'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/briefs/**'
      - 'docs/publisher-operations.md'
      - 'README.md'
      - 'config/user-guide-*.json'
      - 'config/testing-context/**'
      - 'config/qa-verification-batch.json'
      - 'package.json'
      - 'requirements-reporting.txt'
      - '.github/workflows/regression-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report test dependencies
        run: python -m pip install -r requirements-reporting.txt

      - name: Run publisher regression tests
        env:
          TEST2_GIT: /usr/bin/git
        run: node --test scripts/publisher-regression.test.mjs

      - name: Validate canonical worker and coordinator brief contracts
        run: node --test scripts/brief-contracts.test.mjs

      - name: Validate evidence coverage and controlled two-ticket verification
        run: node --test scripts/evidence-coverage.test.mjs

      - name: Prevent overlapping testers on the shared browser
        run: node --test scripts/tester-browser-lease.test.mjs

      - name: Preserve uniquely named screenshots and reject overwritten evidence
        run: node --test scripts/tester-capture.test.mjs

      - name: Run Jira rich-text criteria regression tests
        run: node --test scripts/jira-adf.test.mjs

      - name: Preserve archived tickets during Jira imports
        run: node --test scripts/sync-ticket-folders.test.mjs

      - name: Preserve independent testing cycles and Jira transition pagination
        run: node --test scripts/testing-cycle.test.mjs

      - name: Preserve confirmed source scope through handoffs and publication
        run: node --test scripts/testing-context.test.mjs

      - name: Check in-session authentication recovery
        run: node --test scripts/test2-auth-page.test.cjs

      - name: Check infrastructure retries and blocker report policy
        run: node --test scripts/test-result-policy.test.mjs

      - name: Recover published tests despite unavailable child-task lookups
        run: node --test scripts/reconcile-coordinator-tests.test.mjs

      - name: Require fresh successful Jira imports before coordinator completion
        run: node --test scripts/jira-import-refresh.test.mjs

      - name: Reject unobservable criteria regression cases
        run: node --test scripts/criteria-quality.test.mjs

      - name: Preserve approved criteria during status generation
        run: node --test scripts/generate-status.test.mjs

      - name: Verify amendment targets exist in the living guide
        run: node --test scripts/guide-document-index.test.mjs

      - name: Run evidence report regression tests
        run: python scripts/build-evidence-report.test.py

      - name: Run PDF evidence verifier regression tests
        run: python scripts/verify-report-pdf.test.py

      - name: Preserve editable Word report content within GitHub limits
        run: python scripts/prepare-editable-report.test.py

      - name: Run user-guide builder regression tests
        run: python scripts/build-user-guide.test.py

      - name: Run user-guide evidence verifier regression tests
        run: python scripts/verify-user-guide.test.py

      - name: Validate user-guide configuration
        run: |
          node scripts/check-user-guide-plan.mjs
          node scripts/check-user-guide-impact-policy.mjs
          node scripts/check-user-guide-update-policy.mjs

