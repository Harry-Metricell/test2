name: Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/user-guide-*.json'
      - 'package.json'
      - 'requirements-reporting.txt'
      - '.github/workflows/regression-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/user-guide-*.json'
      - 'package.json'
      - 'requirements-reporting.txt'
      - '.github/workflows/regression-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report test dependencies
        run: python -m pip install -r requirements-reporting.txt

      - name: Run publisher regression tests
        env:
          TEST2_GIT: /usr/bin/git
        run: node --test scripts/publisher-regression.test.mjs

      - name: Run evidence report regression tests
        run: python scripts/build-evidence-report.test.py

      - name: Run PDF evidence verifier regression tests
        run: python scripts/verify-report-pdf.test.py

      - name: Run user-guide builder regression tests
        run: python scripts/build-user-guide.test.py

      - name: Validate user-guide configuration
        run: |
          node scripts/check-user-guide-plan.mjs
          node scripts/check-user-guide-impact-policy.mjs
          node scripts/check-user-guide-update-policy.mjs
