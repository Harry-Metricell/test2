name: Run QA Ticket

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Ticket key, for example TEST2-3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      TICKET: ${{ inputs.ticket }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Run ticket test
        run: node scripts/run-ticket-test.mjs
      - name: Commit QA evidence
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "tickets/$env:TICKET/results.json" "tickets/$env:TICKET/screenshots" "tickets/$env:TICKET/reports"
          git commit -m "Add QA evidence for $env:TICKET" || echo "No evidence changes"
          git pull --rebase origin main
          git push
