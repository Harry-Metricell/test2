name: Check Ticket Criteria

on:
  workflow_run:
    workflows: ["Import Ready For Testing Tickets"]
    types: [completed]

permissions:
  contents: read

jobs:
  criteria:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Allow importer commit to settle
        run: sleep 120

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate ticket folders and criteria
        run: node scripts/check-criteria.mjs

      - name: Check generated status
        run: npm run check
