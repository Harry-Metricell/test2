name: Static QA Plan

on:
  workflow_dispatch:
  push:
    paths:
      - 'tickets/**'
      - 'scripts/generate-status.mjs'
      - 'package.json'
      - '.github/workflows/static-qa-plan.yml'

permissions:
  contents: write

concurrency:
  group: static-qa-plan
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate generated outputs
        run: npm run check

      - name: Commit generated outputs safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            npm run generate
            git add status tickets

            if ! git diff --cached --quiet; then
              git commit -m "Generate QA status plan"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected; retrying."
          done

          echo "Unable to push generated outputs after three attempts."
          exit 1

      - name: Show Codex handoff summary
        run: |
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('status/handoffs.json','utf8')); console.log(JSON.stringify(h,null,2));"
