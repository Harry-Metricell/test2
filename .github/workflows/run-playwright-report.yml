name: Run Playwright QA report

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira ticket key, for example TEST2-3"
        required: true
        type: string
      test_filter:
        description: "Optional pytest expression for the fixed framework"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: playwright-qa
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    env:
      TICKET: ${{ inputs.ticket }}
      TEST_FILTER: ${{ inputs.test_filter }}
      RUNNER_DATA: ${{ env.USERPROFILE }}\MetricellQA
      METRICELL_TEMPLATE: playwright-framework/Framework/Test Document Template.docx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and restore local runner data
        shell: powershell
        run: |
          if ($env:TICKET -notmatch '^TEST2-[0-9]+$') {
            throw "Ticket must match TEST2-<number>."
          }
          $safeTicket = $Matches[0]
          "SAFE_TICKET=$safeTicket" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path -LiteralPath "$env:RUNNER_DATA/Test Document Template.docx")) {
            throw "Copy Test Document Template.docx to $env:RUNNER_DATA on the runner."
          }
          if (-not (Test-Path -LiteralPath "$env:RUNNER_DATA/user.json")) {
            throw "Sign in once and save storage state as $env:RUNNER_DATA/user.json on the runner."
          }
          Copy-Item "$env:RUNNER_DATA/Test Document Template.docx" $env:METRICELL_TEMPLATE -Force
          New-Item -ItemType Directory -Force "playwright-framework/Framework/playwright/.auth" | Out-Null
          Copy-Item "$env:RUNNER_DATA/user.json" "playwright-framework/Framework/playwright/.auth/user.json" -Force
          py --version
          py -c "import pytest, playwright, docx; print('Python QA dependencies available')"

      - name: Run fixed Playwright framework
        shell: powershell
        working-directory: playwright-framework/Framework
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
            py start_metricell_tests.py
          } else {
            py -m pytest test_metricell_v4.py -k $env:TEST_FILTER
            py generate_report_from_template.py --ticket-reports --template $env:METRICELL_TEMPLATE
          }

      - name: Store ticket evidence
        if: always()
        shell: powershell
        run: |
          $ticketRoot = "tickets/$env:SAFE_TICKET"
          New-Item -ItemType Directory -Force "$ticketRoot/reports" | Out-Null
          New-Item -ItemType Directory -Force "$ticketRoot/screenshots" | Out-Null
          if (Test-Path 'playwright-framework/Framework/test-results/results.json') {
            Copy-Item 'playwright-framework/Framework/test-results/results.json' "$ticketRoot/results.json" -Force
          }
          $reports = Get-ChildItem 'playwright-framework/Framework/reports' -File -Filter '*.docx' -ErrorAction SilentlyContinue
          foreach ($report in $reports) {
            Copy-Item $report.FullName "$ticketRoot/reports/$($report.Name)" -Force
          }
          $screens = Get-ChildItem 'playwright-framework/Framework/reports/evidence' -Recurse -File -Include *.png,*.webm,*.zip -ErrorAction SilentlyContinue
          foreach ($item in $screens) {
            Copy-Item $item.FullName "$ticketRoot/screenshots/$($item.Name)" -Force
          }

      - name: Commit evidence
        if: always()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tickets/$env:SAFE_TICKET"
          if (git diff --cached --quiet) {
            Write-Host "No evidence files were produced."
            exit 0
          }
          git commit -m "Add Playwright evidence for $env:SAFE_TICKET"
          git pull --rebase origin main
          git push origin HEAD:main
