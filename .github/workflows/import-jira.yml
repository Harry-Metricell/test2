name: Import Jira Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Jira ticket key, for example TEST2-2"
        required: true

permissions:
  contents: write

jobs:
  import-ticket:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Jira ticket
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.ticket_id }}
        run: |
          mkdir -p "tickets/$TICKET"

          curl -sS --fail \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_URL/rest/api/3/issue/$TICKET" \
            > "tickets/$TICKET/ticket.json"

          if [ ! -f "tickets/$TICKET/status.json" ]; then
            printf '{\n  "ticket": "%s",\n  "status": "Imported"\n}\n' "$TICKET" > "tickets/$TICKET/status.json"
          fi

      - name: Generate status and Codex handoffs
        run: npm run generate

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tickets status
          git commit -m "Import Jira ticket and refresh QA plan" || echo "No changes"
          git push
